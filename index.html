<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اجتماع شباب كنيسة الشهيد العظيم مارجرجس</title>
    <meta name="description" content="استبيان اللقاء الشبابي — مشاركة مجهولة الهوية." />

    <link rel="icon" href="./assets/images/meeting-logo.jpg" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>

  <body class="survey-page">
    <a class="skip-link" href="#surveyMain">تخطَّ إلى المحتوى</a>

    <header class="app-header">
      <div class="container">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <div class="brand">
            <img
              src="./assets/images/meeting-logo.jpg"
              alt="شعار اللقاء"
              class="brand-logo"
            />
            <div class="brand-text">
              <h1 class="brand-title" id="surveyTitle">اجتماع شباب كنيسة الشهيد العظيم مارجرجس بههيا</h1>
              <p class="brand-subtitle" id="surveySubtitle">
                رأيك يهمّنا — جميع الردود مجهولة الهوية.
              </p>
            </div>
          </div>
          <span class="header-badge d-none d-sm-inline-flex align-items-center gap-1">
            <i class="bi bi-shield-lock"></i> مشاركة مجهولة
          </span>
        </div>
      </div>
    </header>

    <main id="surveyMain" class="container survey-main">
      <div id="configNotice" class="alert alert-warning d-none" role="alert"></div>

      <div class="progress-thin mb-3 d-none" id="progressWrap" aria-hidden="true">
        <div
          class="progress-bar"
          id="progressBar"
          role="progressbar"
          style="width: 0%"
        ></div>
      </div>

      <div id="surveyRoot">
        <div class="loading-state" id="loadingState">
          <div class="spinner-border text-danger" role="status" aria-hidden="true"></div>
          <span>جارٍ تحميل الاستبيان…</span>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="container">
       
      </div>
    </footer>

    <script type="module" src="./assets/js/survey.js"></script>
  </body>
</html>
